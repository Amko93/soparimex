<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <title>Cahier des charges — Soparimex</title>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }

    header { background: #0f172a; color: white; padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    header span { font-size: 0.85rem; color: #94a3b8; }

    .progress-bar { background: #1e293b; border-radius: 0; padding: 12px 40px; display: flex; align-items: center; gap: 16px; }
    .progress-track { flex: 1; height: 8px; background: #334155; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 99px; transition: width 0.4s ease; }
    .progress-label { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; }
    .progress-counts { display: flex; gap: 16px; font-size: 0.78rem; }
    .progress-counts span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .container { max-width: 960px; margin: 32px auto; padding: 0 24px 80px; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn { padding: 6px 16px; border-radius: 99px; border: 2px solid transparent; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.15s; background: white; color: #64748b; border-color: #e2e8f0; }
    .filter-btn.active { background: #1e40af; color: white; border-color: #1e40af; }
    .filter-btn:hover:not(.active) { border-color: #94a3b8; }

    .section { margin-bottom: 32px; }
    .section-title { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 12px; padding-left: 4px; }

    .card { background: white; border-radius: 16px; border: 2px solid transparent; margin-bottom: 10px; overflow: hidden; transition: all 0.2s; }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card.done { opacity: 0.55; }
    .card.done .card-title { text-decoration: line-through; color: #94a3b8; }

    .card-header { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; cursor: pointer; }
    .priority-badge { flex-shrink: 0; font-size: 1.1rem; margin-top: 1px; }
    .card-body { flex: 1; }
    .card-title { font-weight: 700; font-size: 0.95rem; line-height: 1.4; margin-bottom: 4px; }
    .card-meta { font-size: 0.78rem; color: #64748b; }
    .card-meta strong { color: #475569; }

    .status-group { flex-shrink: 0; display: flex; gap: 6px; align-items: center; }
    .status-btn { padding: 4px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 800; border: none; cursor: pointer; transition: all 0.15s; opacity: 0.35; }
    .status-btn.active { opacity: 1; }
    .status-btn.todo  { background: #fee2e2; color: #dc2626; }
    .status-btn.wip   { background: #fef3c7; color: #d97706; }
    .status-btn.done  { background: #dcfce7; color: #16a34a; }

    .card-detail { padding: 0 18px 16px 50px; }
    .card-detail textarea { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; font-family: inherit; resize: vertical; outline: none; min-height: 70px; color: #475569; transition: border-color 0.15s; }
    .card-detail textarea:focus { border-color: #3b82f6; }
    .note-label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

    .card[data-priority="critical"] { border-color: #fecaca; }
    .card[data-priority="critical"] .card-header { background: #fff5f5; }
    .card[data-priority="medium"] { border-color: #fed7aa; }
    .card[data-priority="medium"] .card-header { background: #fffaf5; }
    .card[data-priority="minor"] { border-color: #e2e8f0; }
    .card[data-priority="minor"] .card-header { background: #f8fafc; }

    .hidden { display: none !important; }

    .export-btn { position: fixed; bottom: 24px; right: 24px; background: #1e40af; color: white; border: none; padding: 12px 22px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer; box-shadow: 0 4px 16px rgba(30,64,175,0.4); transition: all 0.2s; }
    .export-btn:hover { background: #1d3a9e; transform: translateY(-1px); }

    @media (max-width: 600px) {
      header { padding: 20px; }
      .container { padding: 0 12px 80px; }
      .status-group { flex-direction: column; gap: 4px; }
      .card-header { flex-wrap: wrap; }
    }
  </style>
</head>

// ── State ──────────────────────────────────────────────
let state = {};
let currentFilter = 'all';

function loadState() {
  try { state = JSON.parse(localStorage.getItem('cdc_soparimex') || '{}'); }
  catch { state = {}; }
}

function saveState() {
  localStorage.setItem('cdc_soparimex', JSON.stringify(state));
  document.getElementById('last-updated').textContent = 'Sauvegardé à ' + new Date().toLocaleTimeString('fr-FR');
}

function getItemState(id) {
  return state[id] || { status: 'todo', note: '' };
}

// ── Render ─────────────────────────────────────────────
function render() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  const groups = [
    { key: 'critical', label: '🔴 Critiques — Corriger immédiatement' },
    { key: 'medium',   label: '🟠 Moyens — Bugs UX ou sécurité' },
    { key: 'minor',    label: '🟡 Mineurs — Qualité & polish' },
  ];

  groups.forEach(({ key, label }) => {
    const items = ITEMS.filter(i => {
      if (i.priority !== key) return false;
      if (currentFilter === 'all' || currentFilter === key) return true;
      if (['todo','wip','done'].includes(currentFilter)) return getItemState(i.id).status === currentFilter;
      return false;
    });

    if (items.length === 0) return;

    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<div class="section-title">${label}</div>`;

    items.forEach(item => {
      const s = getItemState(item.id);
      const card = document.createElement('div');
      card.className = `card${s.status === 'done' ? ' done' : ''}`;
      card.dataset.priority = item.priority;
      card.innerHTML = `
        <div class="card-header" onclick="toggleDetail('${item.id}')">
          <div class="priority-badge">${item.emoji}</div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-meta"><strong>${item.file}</strong>${item.line ? ' · Ligne ' + item.line : ''}</div>
          </div>
          <div class="status-group" onclick="event.stopPropagation()">
            <button class="status-btn todo ${s.status==='todo'?'active':''}" onclick="setStatus('${item.id}','todo')">À faire</button>
            <button class="status-btn wip ${s.status==='wip'?'active':''}"  onclick="setStatus('${item.id}','wip')">En cours</button>
            <button class="status-btn done ${s.status==='done'?'active':''}" onclick="setStatus('${item.id}','done')">Terminé</button>
          </div>
        </div>
        <div class="card-detail" id="detail-${item.id}" style="display:none">
          <p style="font-size:0.85rem;color:#475569;margin-bottom:12px;line-height:1.6">${item.detail}</p>
          <div class="note-label">Notes</div>
          <textarea placeholder="Ajouter une note, une solution, une PR..." onchange="setNote('${item.id}',this.value)">${s.note || ''}</textarea>
        </div>
      `;
      section.appendChild(card);
    });

    container.appendChild(section);
  });

  updateProgress();
}

function toggleDetail(id) {
  const el = document.getElementById('detail-' + id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function setStatus(id, status) {
  state[id] = { ...getItemState(id), status };
  saveState();
  render();
}

function setNote(id, note) {
  state[id] = { ...getItemState(id), note };
  saveState();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function updateProgress() {
  const total = ITEMS.length;
  const done  = ITEMS.filter(i => getItemState(i.id).status === 'done').length;
  const wip   = ITEMS.filter(i => getItemState(i.id).status === 'wip').length;
  const todo  = total - done - wip;
  const pct   = Math.round((done / total) * 100);

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct + '% terminé';
  document.getElementById('count-todo').textContent = todo;
  document.getElementById('count-wip').textContent  = wip;
  document.getElementById('count-done').textContent = done;
}

function exportMD() {
  const lines = ['# Cahier des charges — Soparimex\n', `Exporté le ${new Date().toLocaleDateString('fr-FR')}\n`];
  const groups = [
    { key: 'critical', label: '## 🔴 Critiques' },
    { key: 'medium',   label: '## 🟠 Moyens' },
    { key: 'minor',    label: '## 🟡 Mineurs' },
  ];
  groups.forEach(({ key, label }) => {
    lines.push('\n' + label + '\n');
    ITEMS.filter(i => i.priority === key).forEach(item => {
      const s = getItemState(item.id);
      const icon = s.status === 'done' ? '✅' : s.status === 'wip' ? '⏳' : '⬜';
      lines.push(`${icon} **${item.title}**`);
      lines.push(`   - Fichier: \`${item.file}\`${item.line ? ' · Ligne ' + item.line : ''}`);
      lines.push(`   - Statut: ${s.status === 'done' ? 'Terminé' : s.status === 'wip' ? 'En cours' : 'À faire'}`);
      if (s.note) lines.push(`   - Note: ${s.note}`);
      lines.push('');
    });
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cahier-des-charges-soparimex.md';
  a.click();
}

// ── Init ───────────────────────────────────────────────
loadState();
render();
const saved = localStorage.getItem('cdc_soparimex');
if (saved) document.getElementById('last-updated').textContent = 'Dernière sauvegarde chargée';
</script>
